# 1Panel 单文件部署（Linux amd64）。整份粘贴到「容器 → 编排 → 创建编排 → 编辑」。
# 首次安装在面板的「环境变量」区填写：
#   ADVERTISE_IP     玩家能连接的服务器 IPv4，大厅会向玩家公布这个地址。
#   MYSQL_PASSWORD   游戏专用 MySQL 账号的密码；先在 1Panel 建好库并授权。
#   IMAGE_TAG        两张 GHCR 镜像共用的发布标签，建议用 sha- 加完整提交号。Actions 部署包已预填。
#   PANEL_NETWORK    1Panel 中已存在的 Docker 网络，默认 1panel-network。
# MySQL、MongoDB、Redis 和 Memcached 由 1Panel 单独安装。下方 prepare 列出了连接参数及默认值。
# 软件版本参考：Docker Engine 26+，Compose v2.29.7 已验证。

# 共用挂载：各服务从 settings 卷只读加载自己的配置，也从中读取面板 Redis 的连接信息。
x-settings-file: &settings-file {type: volume, source: settings, read_only: true}
x-redis-settings: &redis-settings {<<: *settings-file, target: /srv/redis.json, volume: {nocopy: true, subpath: runtime/redis.json}}
# 共用设置：下方带 <<: *native 的服务复用同一张 C++ 镜像，通过 command 选择进程。
x-native: &native
  platform: linux/amd64
  restart: unless-stopped
  # 游戏进程和 api 共用网络，内部服务通过回环地址通信，宿主机端口统一写在 api 下。
  network_mode: service:api
  image: ghcr.io/jacqueshuang8192/joker-native:${IMAGE_TAG:?填写支持Redis直连的发布标签}
  depends_on:
    api: {condition: service_healthy}
  environment: {JOKER_REDIS_CONFIG: /srv/redis.json}
  security_opt: [no-new-privileges:true]
services:
  # 初始化任务：复用原生镜像，在 settings 卷中准备配置。成功退出后，API 自动启动。
  prepare:
    image: ghcr.io/jacqueshuang8192/joker-native:${IMAGE_TAG:?填写支持Redis直连的发布标签}
    platform: linux/amd64
    user: "0:0"
    networks: [panel]
    volumes: [settings:/settings]
    environment:
      # 下方 host 填容器名或可达的内网地址，port 填服务监听端口。
      # MongoDB 开启认证时填写用户、密码和认证库；Redis 仅使用密码时留空 REDIS_USER。
      PANEL_INI: |
        [deployment]
        network = ${PANEL_NETWORK:-1panel-network}
        advertise_ip = ${ADVERTISE_IP:?填写玩家可达的IPv4地址}
        image_prefix = ghcr.io/jacqueshuang8192/joker
        tag = ${IMAGE_TAG:?填写支持Redis直连的发布标签}
        [mysql]
        host = ${MYSQL_HOST:-mysql}
        port = ${MYSQL_PORT:-3306}
        database = ${MYSQL_DATABASE:-shenshou_game}
        user = ${MYSQL_USER:-shenshou_game}
        password = ${MYSQL_PASSWORD:?填写游戏库密码}
        [mongodb]
        host = ${MONGO_HOST:-mongo}
        port = ${MONGO_PORT:-27017}
        user = ${MONGO_USER:-}
        password = ${MONGO_PASSWORD:-}
        auth_database = ${MONGO_AUTH_DATABASE:-admin}
        [redis]
        host = ${REDIS_HOST:-redis}
        port = ${REDIS_PORT:-6379}
        user = ${REDIS_USER:-}
        password = ${REDIS_PASSWORD:-}
        [memcached]
        host = ${MEMCACHED_HOST:-memcached}
        port = ${MEMCACHED_PORT:-11211}
    entrypoint: [python3, /tmp/prepare.py]
    configs:
      - {source: prepare-script, target: /tmp/prepare.py}

  # Java HTTP 服务：处理客户端登录与业务请求，启动时由内置 Flyway 在游戏库内建表、升级。
  api:
    platform: linux/amd64
    restart: unless-stopped
    networks: [panel]
    environment:
      JOKER_REDIS_CONFIG: /srv/redis.json
      JOKER_CONFIG: /srv/config/api.properties
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx768m"
    image: ghcr.io/jacqueshuang8192/joker-api:${IMAGE_TAG:?填写支持Redis直连的发布标签}
    depends_on: {prepare: {condition: service_completed_successfully}}
    ports:
      # HTTP 接口默认只绑定宿主机回环地址，供宿主机反向代理转发 /hbiInterface/。
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
      # 以下两个游戏 TCP 端口默认绑定所有网卡，对外提供游戏时需在防火墙和安全组放行。
      - "${GAME_BIND:-0.0.0.0}:4700:4700"
      - "${GAME_BIND:-0.0.0.0}:13600:13600"
    volumes:
      - *redis-settings
      - {<<: *settings-file, target: /srv/config/api.properties, volume: {nocopy: true, subpath: runtime/api.properties}}
      - uploads:/srv/uploads
    # 首页能正常响应后，Compose 才启动依赖 API 健康状态的游戏服务。
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, http://127.0.0.1:8080/hbiInterface/index.html]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  # 用户服务，内部端口 7500。
  user:
    <<: *native
    command: [user, -h, 127.0.0.1, -p, "7500", -s, "1", -m, "500000"]
    volumes:
      - *redis-settings
      - {<<: *settings-file, target: /srv/user/conf/config.ini, volume: {nocopy: true, subpath: runtime/user.ini}}
  # 游戏数据服务，内部端口 6001。
  data:
    <<: *native
    command: [data, -h, 127.0.0.1, -p, "6001", -s, "0"]
    volumes:
      - *redis-settings
      - {<<: *settings-file, target: /srv/data/bin/config.xml, volume: {nocopy: true, subpath: runtime/data.xml}}
  # 房间分配服务，内部端口 11603。牛牛启动前会等待它通过健康检查。
  alloc:
    <<: *native
    command: [alloc, -p, "11603", -l, "302", -s, "63", -u, "4", -m, "400", -d]
    volumes:
      - *redis-settings
      - {<<: *settings-file, target: /srv/alloc/bin/server.xml, volume: {nocopy: true, subpath: runtime/alloc.xml}}
      - {<<: *settings-file, target: /srv/alloc/bin/config.ini, volume: {nocopy: true, subpath: runtime/alloc.ini}}
      - {<<: *settings-file, target: /srv/alloc/bin/GameServer.ini, volume: {nocopy: true, subpath: runtime/game.ini}}
  # 牛牛游戏进程，玩家通过 TCP 13600 连接。
  douniu:
    <<: *native
    depends_on:
      alloc: {condition: service_healthy}
    command: [douniu, -p, "13600", -s, "1802", -l, "302", -d]
    volumes:
      - *redis-settings
      - {<<: *settings-file, target: /srv/douniu/bin/server.xml, volume: {nocopy: true, subpath: runtime/douniu.xml}}
  # 可选金币更新服务，默认关闭。启用 gold profile 前须准备 runtime/gold.xml。
  gold:
    <<: *native
    profiles: [gold]
    command: [gold, -h, 127.0.0.1, -p, "6005", -s, "0"]
    volumes:
      - *redis-settings
      - {<<: *settings-file, target: /srv/gold/bin/config.xml, volume: {nocopy: true, subpath: runtime/gold.xml}}
  # 默认启动一个大厅，玩家通过 TCP 4700 连接。ADVERTISE_IP 填玩家可达的 IPv4。
  hall-4700:
    <<: *native
    command: [hall, -p, "4700", -s, "1", -h, "${ADVERTISE_IP:?Set a client-reachable IPv4 address}", -d]
    volumes:
      - *redis-settings
      - {<<: *settings-file, target: /srv/hall/conf/config.xml, volume: {nocopy: true, subpath: runtime/hall-config.xml}}
      - {<<: *settings-file, target: /srv/hall/conf/server.xml, volume: {nocopy: true, subpath: runtime/hall-server.xml}}

# 应用加入已有的面板网络。用基础服务的容器名连接时，应确保它们在该网络上可达。
networks:
  panel:
    external: true
    name: ${PANEL_NETWORK:-1panel-network}
volumes:
  # 保存生成的连接配置和协议密钥，升级时保留并备份。
  settings:
  # API 上传文件，升级或重建时保留此卷。
  uploads:

# prepare 使用的内嵌初始化脚本。首次从 GitHub 下载固定版本的模板并校验摘要；
# 连接参数变更时重新生成配置，沿用 settings 卷中已有的协议密钥。
configs:
  prepare-script:
    content: |
      from pathlib import Path
      from tempfile import TemporaryDirectory
      from urllib.request import urlopen
      import hashlib, json, os, runpy

      os.umask(0o077)
      state = Path("/settings")
      source = state / "source-57b281e25ff3f7ba155b5f0d08b66539f6370943"
      if not source.exists():
          names = """config/alloc.ini.in
      config/alloc.xml.in
      config/api.properties.in
      config/data.xml.in
      config/douniu.xml.in
      config/game.ini.in
      config/gold-example.xml.in
      config/hall-config.xml.in
      config/hall-server.xml.in
      config/user.ini.in
      tools/configure.py""".split()
          with TemporaryDirectory(dir=state) as tmp:
              folder = Path(tmp) / "release"
              digest = hashlib.sha256()
              for name in names:
                  target = folder / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with urlopen("https://raw.githubusercontent.com/jacqueshuang8192/joker/57b281e25ff3f7ba155b5f0d08b66539f6370943/" + name, timeout=30) as response:
                      data = response.read()
                  digest.update(data)
                  target.write_bytes(data)
              if digest.hexdigest() != "162c38190e37dd1060239ba3009593c817b72a2afcd85f07dcbbae118b918737":
                  raise SystemExit("Release file checksum mismatch")
              folder.rename(source)

      cfg = os.environ["PANEL_INI"]
      saved = state / "panel.ini"
      if saved.exists() and saved.read_text() == cfg:
          print("Settings ready")
          raise SystemExit(0)
      with TemporaryDirectory(dir=state) as tmp:
          work = Path(tmp)
          (work / "config").symlink_to(source / "config")
          (work / "panel.ini").write_text(cfg)
          deploy = runpy.run_path(str(source / "tools/configure.py"))
          args = deploy["parse_args"](work)
          values = deploy["configuration_values"](args)
          keys = state / "keys.json"
          if keys.exists():
              values.update(json.loads(keys.read_text()))
          else:
              selected = {k: values[k] for k in ("DEFAULT_KEY","SYSTEM_PASSWORD","SIGN_KEY","AGENT_PASSWORD","AES_KEY","MT_KEY")}
              (work / "keys.json").write_text(json.dumps(selected))
              (work / "keys.json").replace(keys)
          deploy["write_runtime_configs"](work, work / "runtime", values, args.settings["redis"])
          api = work / "runtime/api.properties"
          api.chmod(0o600)
          api.write_text(api.read_text().replace("game.round=3", "game.round=1"))
          api.chmod(0o444)
          (state / "runtime").mkdir(exist_ok=True)
          for file in (work / "runtime").iterdir(): file.replace(state / "runtime" / file.name)
          (work / "panel.ini").replace(saved)
      print("Settings ready")
