include:
  - game-services.yml

services:
  flyway:
    image: flyway/flyway:11.15.0-alpine
    platform: linux/amd64
    networks: [panel]
    volumes:
      - type: bind
        source: ./database/migrations
        target: /flyway/sql
        read_only: true
        bind: {create_host_path: false}
      - ./runtime/flyway.conf:/flyway/conf/joker.conf:ro
    command: ["-configFiles=/flyway/conf/joker.conf", "migrate"]

  api:
    platform: linux/amd64
    restart: unless-stopped
    network_mode: service:redis-link
    environment:
      JOKER_CONFIG: /srv/config/api.properties
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx768m"
    image: ${IMAGE_PREFIX:?Run tools/configure.py}-api:${IMAGE_TAG:?Image tag required}
    depends_on:
      flyway: {condition: service_completed_successfully}
      redis-link: {condition: service_healthy}
    volumes:
      - ./runtime/api.properties:/srv/config/api.properties:ro
      - uploads:/srv/uploads
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, http://127.0.0.1:8080/hbiInterface/index.html]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

networks:
  panel:
    external: true
    name: ${PANEL_NETWORK:?Set your 1Panel Docker network}
volumes:
  uploads:
