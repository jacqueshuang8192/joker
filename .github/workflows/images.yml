name: Build and publish backend images
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  client-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /client/tests/
            /client/**/ScoketGame.lua
            /client/**/Encrypt.lua
            /client/**/ByteArray.lua
            /client/**/group_join.lua
            /client/**/HallServer.lua
            /client/**/ItremGame.lua
            /client/**/FriendTable.lua
            /client/**/ChipPurchase.lua
            /client/**/HundredTable.lua
            /client/**/HALL_PROTOCOL.lua
            /client/**/network/PacketParser.lua
            /client/**/network/PACKET_DATA_TYPE.lua
            /client/**/login/UsernameView.lua
            /client/**/network/Request.lua
            /client/**/familyCircle/TheInvitationLayer.lua
            /client/**/assets/TTLuaHelps.lua
      - name: Check packaged Cocos hall, room, gift and invitation flows
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python3 client/tests/check_douniu_client.py
  pure-java:
    name: Verify and publish pure Java images
    needs: client-protocol
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Build backend images without downloading client artwork.
          sparse-checkout: |
            .github/actions/build-java-images
            backend/api
            backend/game-java
            backend/table-rules
            backend/tests
            config
            deploy/1panel
            tools
      - uses: ./.github/actions/build-java-images
      - name: Exercise Java rooms and WebSocket gateway
        run: |
          java -cp backend/game-java/target/classes backend/game-java/tests/DouniuCheck.java backend/game-java/target/joker-game-java.jar
          java backend/game-java/tests/GatewayCheck.java backend/game-java/target/joker-game-java.jar
      - name: Verify the pure Java 1Panel stack and room recovery
        run: |
          bash backend/game-java/tests/domain.sh
          bash backend/tests/pure-java.sh
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified pure Java tags
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for kind in api game-java; do
            docker tag "$PREFIX-$kind:$TAG" "$PREFIX-$kind:java-$TAG"
            docker push "$PREFIX-$kind:java-$TAG"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              docker tag "$PREFIX-$kind:$TAG" "$PREFIX-$kind:java-main"
              docker push "$PREFIX-$kind:java-main"
            fi
          done
      - name: Prepare versioned pure Java Compose
        if: github.event_name != 'pull_request'
        env:
          ADVERTISE_IP: 127.0.0.1
          MYSQL_PASSWORD: compose-validation
        run: |
          sed 's/${IMAGE_TAG:?填写内置初始化脚本的发布标签}/java-'"$TAG"'/g' deploy/1panel/pure-java.yml > "$RUNNER_TEMP/docker-compose.yml"
          diff <(printf '%s\n' "$PREFIX-api:java-$TAG" "$PREFIX-game-java:java-$TAG" | sort) \
               <(IMAGE_PREFIX="$PREFIX" docker compose -p validate -f "$RUNNER_TEMP/docker-compose.yml" --profile gold config --images | sort -u)
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: 1panel-pure-java
          path: ${{ runner.temp }}/docker-compose.yml

  native-mixed:
    name: Verify and publish native and mixed images
    needs: pure-java
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Build backend images without downloading client artwork.
          sparse-checkout: |
            .github/actions/build-java-images
            backend/api
            backend/native
            backend/game-java
            backend/table-rules
            deploy/java
            backend/tests
            config
            deploy/1panel
            tools
      - uses: ./.github/actions/build-java-images
      - name: Build native image and compare Java services
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -f backend/native/Dockerfile -t "$PREFIX-native:$TAG" .
          python3 backend/game-java/tests/compare.py "$PREFIX-native:$TAG" "$PREFIX-game-java:$TAG"
      - name: Smoke test the stack on a fresh database
        env: {CHECK_JAVA_VARIANT: "1"}
        run: bash backend/tests/smoke.sh
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified images
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for kind in api native game-java; do docker push "$PREFIX-$kind:$TAG"; done
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            for kind in api native game-java; do
              docker tag "$PREFIX-$kind:$TAG" "$PREFIX-$kind:$GITHUB_REF_NAME"
              docker push "$PREFIX-$kind:$GITHUB_REF_NAME"
            done
          fi

      - name: Package files for 1Panel
        if: github.event_name != 'pull_request'
        run: |
          sed -i -e "s|^image_prefix = .*|image_prefix = $PREFIX|" -e "s/^tag = main$/tag = $TAG/" panel.ini.example
          sed -i 's/${IMAGE_TAG:?填写内置初始化脚本的发布标签}/'"$TAG"'/g' deploy/1panel/docker-compose.yml
          sed -i 's/${IMAGE_TAG:?填写含 Java 游戏服务的发布标签}/'"$TAG"'/g' deploy/java/docker-compose.yml
          sed -i 's/${IMAGE_TAG:?填写内置初始化脚本的发布标签}/java-'"$TAG"'/g' deploy/1panel/pure-java.yml
          tar czf 1panel-deploy.tar.gz docker-compose.yml deploy/1panel/pure-java.yml deploy/1panel/docker-compose.yml deploy/java panel.ini.example config tools/configure.py tools/check-schema.sql README.md AUDIT.md DEPLOYMENT.md
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: 1panel-deploy
          path: 1panel-deploy.tar.gz
