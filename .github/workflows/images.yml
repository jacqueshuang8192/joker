name: Build and publish backend images
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The client artwork is not part of either backend image.
          sparse-checkout: |
            backend/api
            backend/native
            backend/tests
            config
            deploy/1panel
            tools
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - name: Compile the API from source
        run: mvn -B -f backend/api/pom.xml clean package
      - name: Build and validate both images
        shell: bash
        run: |
          set -euo pipefail
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}"
          echo "PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          build=(docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA")
          "${build[@]}" -t "$prefix-api:$tag" backend/api
          "${build[@]}" -f backend/native/Dockerfile -t "$prefix-native:$tag" .
          docker run --rm --entrypoint java "$prefix-api:$tag" -version
      - name: Smoke test the stack on a fresh database
        run: bash backend/tests/smoke.sh
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified pair
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for kind in api native; do docker push "$PREFIX-$kind:$TAG"; done
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            for kind in api native; do
              docker tag "$PREFIX-$kind:$TAG" "$PREFIX-$kind:$GITHUB_REF_NAME"
              docker push "$PREFIX-$kind:$GITHUB_REF_NAME"
            done
          fi

      - name: Package files for 1Panel
        if: github.event_name != 'pull_request'
        run: |
          sed -i -e "s|^image_prefix = .*|image_prefix = $PREFIX|" -e "s/^tag = main$/tag = $TAG/" panel.ini.example
          sed -i 's/${IMAGE_TAG:?填写内置初始化脚本的发布标签}/'"$TAG"'/g' deploy/1panel/docker-compose.yml
          tar czf 1panel-deploy.tar.gz docker-compose.yml deploy/1panel/docker-compose.yml panel.ini.example config tools/configure.py tools/check-schema.sql README.md AUDIT.md DEPLOYMENT.md
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: 1panel-deploy
          path: 1panel-deploy.tar.gz
