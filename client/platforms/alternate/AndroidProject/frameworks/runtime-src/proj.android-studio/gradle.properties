# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specify JDK 1.8 for Gradle (required by Gradle 4.10.3)

# NDK and SDK configuration (old syntax for AGP 3.0.1)

# Close parallel build to avoid Windows process creation failure
org.gradle.parallel=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.overridePathCheck=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
PROP_COMPILE_SDK_VERSION=28
PROP_MIN_SDK_VERSION=19
PROP_TARGET_SDK_VERSION=28
PROP_APP_PLATFORM=19
PROP_APP_ABI=armeabi-v7a:arm64-v8a:x86

# uncomment it and fill in sign information for release mode
#RELEASE_STORE_FILE=file path of keystore
#RELEASE_STORE_PASSWORD=password of keystore
#RELEASE_KEY_ALIAS=alias of key
#RELEASE_KEY_PASSWORD=password of key

# if you want to encrypt lua codes, uncomment the codes and set value to PROP_LUA_ENCRYPT_KEY and PROP_LUA_ENCRYPT_SIGN
#PROP_LUA_ENCRYPT=1
#PROP_LUA_ENCRYPT_KEY=
#PROP_LUA_ENCRYPT_SIGN=
