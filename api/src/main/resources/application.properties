spring.application.name=joker-api
spring.config.import=file:${JOKER_CONFIG:config.properties}
server.servlet.context-path=/hbiInterface
server.servlet.encoding.force=true
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp
springdoc.api-docs.path=/api-docs
springdoc.packages-to-scan=com.j.joker.controller

spring.flyway.url=${jdbc.url}
spring.flyway.user=${jdbc.user}
spring.flyway.password=${jdbc.password}
spring.flyway.connect-retries=15
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
