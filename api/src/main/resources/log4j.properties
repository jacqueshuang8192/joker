# 1. 根日志级别设置为 INFO
log4j.rootLogger=INFO, stdout, file, errorFile

# 控制台日志输出
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# 普通文件日志输出 - 使用 catalina.base 路径
log4j.appender.file=org.apache.log4j.DailyRollingFileAppender
log4j.appender.file.File=${catalina.base}/logs/hbiInterface.log
log4j.appender.file.DatePattern='.'yyyy-MM-dd
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
log4j.appender.file.Append=true

# 错误文件日志输出 - 使用 catalina.base 路径
log4j.appender.errorFile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.errorFile.File=${catalina.base}/logs/hbiInterface_error.log
log4j.appender.errorFile.DatePattern='.'yyyy-MM-dd
log4j.appender.errorFile.Threshold=ERROR
log4j.appender.errorFile.layout=org.apache.log4j.PatternLayout
log4j.appender.errorFile.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
log4j.appender.errorFile.Append=true

# 2. 开启业务包的 DEBUG 日志
log4j.logger.com.hbi=DEBUG
log4j.logger.com.core=DEBUG

# 3. 开启 MyBatis SQL 及参数打印
log4j.logger.org.apache.ibatis=DEBUG
log4j.logger.org.mybatis=DEBUG

# 4. 保持第三方框架日志为 INFO，防止刷屏
log4j.logger.org.springframework=INFO
log4j.logger.com.alibaba.druid=INFO
log4j.logger.org.apache.catalina=INFO
